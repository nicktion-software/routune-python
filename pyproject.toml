[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "routune"
version = "0.1.0"
description = "Official Python library for the Routune API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Routune", email = "developers@routune.com" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25,<1",
  "pydantic>=2.5,<3",
  "typing_extensions>=4.7",
]
keywords = ["routune", "delivery", "dispatch", "logistics", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://routune.com/developers"
Repository = "https://github.com/nicktion-software/routune-python"
Changelog = "https://github.com/nicktion-software/routune-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10", "datamodel-code-generator>=0.40", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/routune"]

[tool.hatch.build.targets.sdist]
include = ["src/routune", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/routune"]

[[tool.mypy.overrides]]
module = "routune.types._models"
disable_error_code = ["misc"]
